<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liquid Glass Photo Booth</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px 15px;

    overflow-x: hidden;

    background:
        linear-gradient(
            120deg,
            #9bdff5,
            #b9a7ef,
            #f2bddf,
            #9eddf1
        );

    background-size: 300% 300%;

    animation:
        backgroundMove 15s ease infinite;
}


/* =====================================================
   BACKGROUND
===================================================== */

@keyframes backgroundMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


.orb {

    position: fixed;

    border-radius: 50%;

    pointer-events: none;

    filter: blur(3px);

    opacity: .35;

    z-index: 0;

    animation:
        orbFloat 10s ease-in-out infinite alternate;
}


.orb1 {

    width: 300px;
    height: 300px;

    left: -100px;
    top: -100px;

    background:
        rgba(255,255,255,.7);
}


.orb2 {

    width: 230px;
    height: 230px;

    right: -70px;
    top: 20%;

    background:
        rgba(170,210,255,.7);

    animation-delay: 2s;
}


.orb3 {

    width: 280px;
    height: 280px;

    left: 30%;
    bottom: -130px;

    background:
        rgba(255,180,220,.7);

    animation-delay: 4s;
}


@keyframes orbFloat {

    from {
        transform:
            translate(0,0)
            scale(1);
    }

    to {
        transform:
            translate(60px,50px)
            scale(1.15);
    }

}


/* =====================================================
   MAIN GLASS
===================================================== */

.booth {

    position: relative;

    z-index: 2;

    width: min(1000px, 96%);

    padding: 30px;

    border-radius: 38px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.38),
            rgba(255,255,255,.14)
        );

    border:
        1px solid
        rgba(255,255,255,.7);

    backdrop-filter:
        blur(35px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(35px)
        saturate(160%);

    box-shadow:

        0 35px 90px
        rgba(40,60,100,.28),

        inset 0 1px 2px
        rgba(255,255,255,.9);

    animation:
        boothIn .8s cubic-bezier(.2,.8,.2,1);
}


@keyframes boothIn {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.95);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =====================================================
   HEADER
===================================================== */

.header {

    text-align: center;

    margin-bottom: 25px;
}


.logo {

    font-size: 43px;

    font-weight: 800;

    letter-spacing: -1px;

    text-shadow:
        0 5px 20px
        rgba(50,60,90,.2);
}


.subtitle {

    margin-top: 7px;

    font-size: 15px;

    color:
        rgba(255,255,255,.8);
}


/* =====================================================
   CAMERA
===================================================== */

.camera {

    position: relative;

    width: 100%;

    overflow: hidden;

    border-radius: 28px;

    background:
        rgba(0,0,0,.28);

    border:
        1px solid
        rgba(255,255,255,.6);

    box-shadow:

        0 20px 50px
        rgba(30,50,80,.25),

        inset 0 1px 1px
        rgba(255,255,255,.5);
}


video {

    width: 100%;

    display: block;

    transform:
        scaleX(-1);

    transition:
        filter .4s ease;
}


/* =====================================================
   ACCESSORY PREVIEW
===================================================== */

.accessory-preview {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 4;
}


/* Hat */

.preview-hat {

    position: absolute;

    left: 50%;

    top: 3%;

    transform:
        translateX(-50%);

    font-size:
        clamp(60px, 11vw, 120px);

    display: none;

    filter:
        drop-shadow(
            0 7px 8px
            rgba(0,0,0,.3)
        );
}


/* Glasses */

.preview-glasses {

    position: absolute;

    left: 50%;

    top: 42%;

    transform:
        translate(-50%, -50%);

    font-size:
        clamp(45px, 8vw, 85px);

    display: none;

    filter:
        drop-shadow(
            0 5px 7px
            rgba(0,0,0,.3)
        );
}


/* Mustache */

.preview-mustache {

    position: absolute;

    left: 50%;

    top: 57%;

    transform:
        translate(-50%, -50%);

    font-size:
        clamp(35px, 6vw, 65px);

    display: none;

    filter:
        drop-shadow(
            0 4px 5px
            rgba(0,0,0,.35)
        );
}


/* =====================================================
   STATUS
===================================================== */

.camera-status {

    position: absolute;

    top: 16px;
    left: 16px;

    z-index: 8;

    padding:
        8px 13px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.18);

    border:
        1px solid
        rgba(255,255,255,.45);

    backdrop-filter:
        blur(12px);

    font-size: 12px;
}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown {

    position: absolute;

    inset: 0;

    z-index: 10;

    display: none;

    justify-content: center;

    align-items: center;

    font-size: 120px;

    font-weight: 800;

    text-shadow:

        0 5px 25px
        rgba(0,0,0,.35),

        0 0 40px
        rgba(255,255,255,.6);
}


.countdown.show {

    display: flex;

    animation:
        countdownPop .9s ease;
}


@keyframes countdownPop {

    0% {

        opacity: 0;

        transform:
            scale(1.5);
    }

    40% {

        opacity: 1;

        transform:
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            scale(.8);
    }

}


/* =====================================================
   FLASH
===================================================== */

.flash {

    position: absolute;

    inset: 0;

    z-index: 15;

    background: white;

    opacity: 0;

    pointer-events: none;
}


.flash.active {

    animation:
        flashEffect .35s ease;
}


@keyframes flashEffect {

    0% {
        opacity: 0;
    }

    30% {
        opacity: .9;
    }

    100% {
        opacity: 0;
    }

}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 22px;
}


/* =====================================================
   SELECT
===================================================== */

select {

    appearance: none;

    border:
        1px solid
        rgba(255,255,255,.6);

    border-radius: 16px;

    padding:
        13px 40px 13px 17px;

    color: white;

    background:
        rgba(255,255,255,.18);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    outline: none;

    cursor: pointer;

    box-shadow:

        inset 0 1px 1px
        rgba(255,255,255,.7),

        0 8px 20px
        rgba(50,70,100,.12);

    transition:
        .3s ease;
}


select:hover {

    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.3);
}


select option {

    background:
        #8589b4;

    color: white;
}


/* =====================================================
   BUTTON
===================================================== */

button {

    position: relative;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.65);

    border-radius: 17px;

    padding:
        14px 24px;

    color: white;

    background:
        rgba(255,255,255,.2);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    cursor: pointer;

    font-weight: 700;

    box-shadow:

        inset 0 1px 1px
        rgba(255,255,255,.8),

        0 10px 25px
        rgba(50,70,100,.15);

    transition:

        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}


button::before {

    content: "";

    position: absolute;

    top: -100%;

    left: -80%;

    width: 50%;

    height: 300%;

    transform:
        rotate(25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.55),
            transparent
        );

    transition:
        left .7s ease;
}


button:hover::before {

    left: 140%;
}


button:hover {

    transform:
        translateY(-4px)
        scale(1.02);

    background:
        rgba(255,255,255,.32);

    box-shadow:

        inset 0 1px 1px
        rgba(255,255,255,.9),

        0 15px 35px
        rgba(50,70,100,.22);
}


button:active {

    transform:
        translateY(1px)
        scale(.97);
}


button:disabled {

    cursor:
        not-allowed;
}


/* =====================================================
   CAPTURE
===================================================== */

.capture {

    padding:
        16px 32px;

    font-size: 17px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.43),
            rgba(255,190,225,.32)
        );
}


/* =====================================================
   RETAKE / DOWNLOAD
===================================================== */

.retake,
.download {

    display: none;
}


/* =====================================================
   RESULT
===================================================== */

.result {

    display: flex;

    justify-content: center;

    margin-top: 28px;
}


canvas {

    display: none;

    width:
        min(500px,100%);

    height: auto;

    border-radius: 20px;

    border:
        1px solid
        rgba(255,255,255,.8);

    box-shadow:

        0 25px 60px
        rgba(40,60,90,.3),

        0 0 0 8px
        rgba(255,255,255,.08);

    animation:
        resultIn .7s ease;
}


@keyframes resultIn {

    from {

        opacity: 0;

        transform:
            translateY(20px)
            scale(.94);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =====================================================
   MESSAGE
===================================================== */

.bottom {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 8px;

    margin-top: 18px;

    color:
        rgba(255,255,255,.75);

    font-size: 13px;
}


.dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px white;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

    body {
        padding: 12px;
    }

    .booth {

        width: 100%;

        padding: 18px;

        border-radius: 28px;
    }

    .logo {
        font-size: 32px;
    }

    .subtitle {
        font-size: 13px;
    }

    .countdown {
        font-size: 80px;
    }

    .controls {
        flex-direction: column;
    }

    select,
    button {
        width: 100%;
    }

    .capture {
        padding: 16px;
    }

}

</style>

</head>


<body>


<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>


<div class="booth">


    <!-- HEADER -->

    <div class="header">

        <h1 class="logo">
            📸 Liquid Booth
        </h1>

        <p class="subtitle">
            Capture the moment. Keep the memory. ✨
        </p>

    </div>


    <!-- CAMERA -->

    <div class="camera">

        <video
            id="video"
            autoplay
            playsinline>
        </video>


        <!-- ACCESSORY PREVIEW -->

        <div class="accessory-preview">

            <div
                class="preview-hat"
                id="previewHat">

                🤠

            </div>


            <div
                class="preview-glasses"
                id="previewGlasses">

                🕶️

            </div>


            <div
                class="preview-mustache"
                id="previewMustache">

                🥸

            </div>

        </div>


        <div
            class="camera-status"
            id="cameraStatus">

            ● Starting Camera...

        </div>


        <div
            class="countdown"
            id="countdown">

            3

        </div>


        <div
            class="flash"
            id="flash">
        </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">


        <!-- FRAME -->

        <select id="frame">

            <option value="joyful">
                🌈 Joyful
            </option>

            <option value="romantic">
                💕 Romantic
            </option>

            <option value="funny">
                🤪 Funny
            </option>

            <option value="cute">
                ✨ Cute
            </option>

            <option value="classic">
                🖤 Classic
            </option>

        </select>


        <!-- FILTER -->

        <select id="filter">

            <option value="none">
                🎨 Original
            </option>

            <option value="grayscale(1)">
                🖤 Black & White
            </option>

            <option value="sepia(1)">
                🤎 Vintage
            </option>

            <option value="contrast(1.15) saturate(1.4)">
                🌈 Vivid
            </option>

            <option value="brightness(1.15)">
                ☀️ Bright
            </option>

        </select>


        <!-- ACCESSORIES -->

        <select id="accessory">

            <option value="none">
                🙂 No Accessory
            </option>

            <option value="glasses">
                🕶️ Kacamata
            </option>

            <option value="hat">
                🤠 Topi Koboi
            </option>

            <option value="mustache">
                🥸 Kumis
            </option>

            <option value="cowboy">
                🤠 Koboi Lengkap
            </option>

        </select>


        <!-- TAKE -->

        <button
            class="capture"
            id="captureBtn">

            📸 Take Photos

        </button>


        <!-- RETAKE -->

        <button
            class="retake"
            id="retakeBtn">

            🔄 Retake

        </button>


        <!-- DOWNLOAD -->

        <button
            class="download"
            id="downloadBtn">

            ⬇️ Save Photo

        </button>

    </div>


    <!-- RESULT -->

    <div class="result">

        <canvas id="canvas"></canvas>

    </div>


    <!-- MESSAGE -->

    <div class="bottom">

        <span class="dot"></span>

        <span id="message">

            Allow camera access to begin

        </span>

    </div>

</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const countdown =
    document.getElementById("countdown");

const flash =
    document.getElementById("flash");

const filter =
    document.getElementById("filter");

const frame =
    document.getElementById("frame");

const accessory =
    document.getElementById("accessory");

const message =
    document.getElementById("message");

const cameraStatus =
    document.getElementById("cameraStatus");

const captureBtn =
    document.getElementById("captureBtn");

const retakeBtn =
    document.getElementById("retakeBtn");

const downloadBtn =
    document.getElementById("downloadBtn");


const previewHat =
    document.getElementById("previewHat");

const previewGlasses =
    document.getElementById("previewGlasses");

const previewMustache =
    document.getElementById("previewMustache");


let photos = [];

let takingPhotos = false;

let cameraReady = false;


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Camera API unavailable"
            );

        }


        const stream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject =
            stream;


        cameraReady =
            true;


        cameraStatus.innerText =
            "● Camera Ready";


        message.innerText =
            "Choose a frame, filter and accessory ✨";

    }

    catch (error) {

        cameraReady =
            false;


        cameraStatus.innerText =
            "● Camera Blocked";


        message.innerText =
            "Please allow camera access 📷";


        console.error(error);

    }

}


startCamera();


/* =====================================================
   ACCESSORY PREVIEW
===================================================== */

function updateAccessoryPreview() {

    const selected =
        accessory.value;


    previewHat.style.display =
        "none";

    previewGlasses.style.display =
        "none";

    previewMustache.style.display =
        "none";


    if (
        selected === "hat"
    ) {

        previewHat.style.display =
            "block";

    }


    if (
        selected === "glasses"
    ) {

        previewGlasses.style.display =
            "block";

    }


    if (
        selected === "mustache"
    ) {

        previewMustache.style.display =
            "block";

    }


    if (
        selected === "cowboy"
    ) {

        previewHat.style.display =
            "block";

        previewGlasses.style.display =
            "block";

        previewMustache.style.display =
            "block";

    }

}


accessory.addEventListener(
    "change",
    updateAccessoryPreview
);


/* =====================================================
   FILTER PREVIEW
===================================================== */

filter.addEventListener(
    "change",
    function() {

        video.style.filter =
            this.value;

    }
);


/* =====================================================
   COUNTDOWN
===================================================== */

function runCountdown() {

    return new Promise(resolve => {

        let number = 3;


        function showNumber() {

            countdown.innerText =
                number;


            countdown.classList.remove(
                "show"
            );


            void countdown.offsetWidth;


            countdown.classList.add(
                "show"
            );

        }


        showNumber();


        const timer =
            setInterval(() => {

                number--;


                if (
                    number <= 0
                ) {

                    clearInterval(
                        timer
                    );


                    countdown.classList.remove(
                        "show"
                    );


                    resolve();

                }

                else {

                    showNumber();

                }

            }, 1000);

    });

}


/* =====================================================
   FLASH
===================================================== */

function cameraFlash() {

    flash.classList.remove(
        "active"
    );


    void flash.offsetWidth;


    flash.classList.add(
        "active"
    );

}


/* =====================================================
   TAKE PHOTO
===================================================== */

function takePhoto() {

    const tempCanvas =
        document.createElement(
            "canvas"
        );


    const width =
        video.videoWidth || 1280;


    const height =
        video.videoHeight || 720;


    tempCanvas.width =
        width;


    tempCanvas.height =
        height;


    const tempCtx =
        tempCanvas.getContext(
            "2d"
        );


    /* Mirror */

    tempCtx.translate(
        width,
        0
    );


    tempCtx.scale(
        -1,
        1
    );


    /* Filter */

    tempCtx.filter =
        filter.value;


    tempCtx.drawImage(
        video,
        0,
        0,
        width,
        height
    );


    /* Accessories */

    drawAccessories(
        tempCtx,
        width,
        height,
        accessory.value
    );


    return tempCanvas;

}


/* =====================================================
   DRAW ACCESSORIES ON PHOTO
===================================================== */

function drawAccessories(
    context,
    width,
    height,
    type
) {

    context.save();

    context.textAlign =
        "center";


    /*
       These emoji accessories
       are drawn directly into
       the photo, so they will
       also appear in download.
    */


    /* TOPI */

    if (
        type === "hat" ||
        type === "cowboy"
    ) {

        context.font =
            `${Math.round(width * .18)}px Arial`;


        context.fillText(
            "🤠",
            width / 2,
            height * .25
        );

    }


    /* KACAMATA */

    if (
        type === "glasses" ||
        type === "cowboy"
    ) {

        context.font =
            `${Math.round(width * .12)}px Arial`;


        context.fillText(
            "🕶️",
            width / 2,
            height * .53
        );

    }


    /* KUMIS */

    if (
        type === "mustache" ||
        type === "cowboy"
    ) {

        context.font =
            `${Math.round(width * .10)}px Arial`;


        context.fillText(
            "🥸",
            width / 2,
            height * .68
        );

    }


    context.restore();

}


/* =====================================================
   PHOTO SESSION
===================================================== */

async function startPhotoSession() {

    if (
        takingPhotos
    ) {
        return;
    }


    if (
        !cameraReady
    ) {

        alert(
            "Camera belum siap. Izinkan akses kamera terlebih dahulu."
        );

        return;

    }


    takingPhotos =
        true;


    photos = [];


    captureBtn.disabled =
        true;


    captureBtn.style.opacity =
        ".5";


    retakeBtn.style.display =
        "none";


    downloadBtn.style.display =
        "none";


    canvas.style.display =
        "none";


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        message.innerText =
            `Photo ${i + 1} of 4 — Get ready!`;


        await runCountdown();


        cameraFlash();


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    120
                )
        );


        photos.push(
            takePhoto()
        );


        message.innerText =
            `Photo ${i + 1} captured ✨`;


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    700
                )
        );

    }


    createPhotoStrip();


    takingPhotos =
        false;

}


/* =====================================================
   CREATE PHOTO STRIP
===================================================== */

function createPhotoStrip() {

    const width =
        600;


    const photoHeight =
        420;


    const padding =
        35;


    const gap =
        18;


    const footer =
        120;


    canvas.width =
        width;


    canvas.height =
        padding +
        photoHeight * 4 +
        gap * 3 +
        footer;


    const selected =
        frame.value;


    /* =========================
       BACKGROUND
    ========================= */

    const bg =
        ctx.createLinearGradient(
            0,
            0,
            width,
            canvas.height
        );


    if (
        selected === "joyful"
    ) {

        bg.addColorStop(
            0,
            "#fff1a8"
        );

        bg.addColorStop(
            1,
            "#ffd6ec"
        );

    }

    else if (
        selected === "romantic"
    ) {

        bg.addColorStop(
            0,
            "#ffd9e7"
        );

        bg.addColorStop(
            1,
            "#f4c8df"

        );

/* =====================================================
   ROUNDED RECT
===================================================== */

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
) {

    context.beginPath();


    context.moveTo(
        x + radius,
        y
    );


    context.lineTo(
        x + width - radius,
        y
    );


    context.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );


    context.lineTo(
        x + width,
        y + height - radius
    );


    context.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );


    context.lineTo(
        x + radius,
        y + height
    );


    context.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );


    context.lineTo(
        x,
        y + radius
    );


    context.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );


    context.closePath();

}


/* =====================================================
   DECORATIONS
===================================================== */

function drawDecorations(type) {

    ctx.textAlign =
        "center";


    ctx.font =
        "30px Arial";


    if (
        type === "joyful"
    ) {

        ctx.fillText(
            "⭐ 🌈 ☀️ 🌈 ⭐",
            300,
            25
        );


        ctx.fillText(
            "🎈 ✨ 🎈 ✨ 🎈",
            300,
            canvas.height - 82
        );

    }

    else if (
        type === "romantic"
    ) {

        ctx.fillText(
            "💕 💗 💕 💗 💕",
            300,
            25
        );


        ctx.fillText(
            "💖 💕 💖 💕 💖",
            300,
            canvas.height - 82
        );

    }

    else if (
        type === "funny"
    ) {

        ctx.fillText(
            "😂 🤪 😂 🤪 😂",
            300,
            25
        );


        ctx.font =
            "bold 20px Arial";


        ctx.fillText(
            "HAHA • LOL • OMG",
            300,
            canvas.height - 82
        );

    }

    else if (
        type === "cute"
    ) {

        ctx.fillText(
            "✨ 🌸 ✨ 🌸 ✨",
            300,
            25
        );


        ctx.fillText(
            "🌷 ⭐ 🌷 ⭐ 🌷",
            300,
            canvas.height - 82
        );

    }

    else {

        ctx.fillText(
            "• • • • •",
            300,
            25
        );

    }

}

===================================================== */

function resetBooth() {

    photos = [];


    canvas.style.display =

    retakeBtn.style.display =

    downloadBtn.style.display =

}


/* =====================================================
   DOWNLOAD - FIXED
===================================================== */

function downloadPhoto() {

    if (
        canvas.width === 0 ||
        canvas.height === 0
    ) {

        alert(
            "Foto belum tersedia!"
        );

        return;

    }


    message.innerText =
        "Preparing your photo... ⏳";


    canvas.toBlob(
        function(blob) {

            if (!blob) {

                message.innerText =
                    "Download failed ❌";

                alert(
                    "Gagal membuat file foto."
                );

                return;

            }


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "liquid-glass-photobooth.png";


            link.style.display =
                "none";


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


            message.innerText =
                "Photo saved successfully! 🎉";

        },
        "image/png"
    );

}

);


downloadBtn.addEventListener(
