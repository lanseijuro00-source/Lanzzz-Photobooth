<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liquid Glass Photo Booth</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

button,
select {
    font: inherit;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 30px 15px;

    overflow-x: hidden;

    background:
        linear-gradient(
            135deg,
            #9fd8ef,
            #b9a7df,
            #efbddc,
            #91cce6
        );

    background-size: 300% 300%;

    animation:
        backgroundMove 18s ease infinite;

}


/* =====================================================
   ANIMATED BACKGROUND
===================================================== */

@keyframes backgroundMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* =====================================================
   FLOATING ORBS
===================================================== */

.orb {

    position: fixed;

    border-radius: 50%;

    pointer-events: none;

    filter: blur(2px);

    opacity: .35;

    z-index: 0;

    animation:
        orbFloat 10s ease-in-out infinite alternate;

}


.orb.one {

    width: 280px;
    height: 280px;

    background:
        rgba(255,255,255,.7);

    top: -100px;
    left: -80px;

}


.orb.two {

    width: 220px;
    height: 220px;

    background:
        rgba(150,190,255,.7);

    right: -70px;
    top: 20%;

    animation-delay: 2s;

}


.orb.three {

    width: 300px;
    height: 300px;

    background:
        rgba(255,180,220,.6);

    bottom: -130px;
    left: 30%;

    animation-delay: 4s;

}


@keyframes orbFloat {

    from {
        transform:
            translate(0,0)
            scale(1);
    }

    to {
        transform:
            translate(70px,50px)
            scale(1.15);
    }

}


/* =====================================================
   MAIN
===================================================== */

.booth {

    position: relative;

    z-index: 2;

    width: min(1000px, 96%);

    padding: 30px;

    border-radius: 38px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.38),
            rgba(255,255,255,.14)
        );

    border:
        1px solid
        rgba(255,255,255,.65);

    backdrop-filter:
        blur(35px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(35px)
        saturate(150%);

    box-shadow:

        0 35px 90px
        rgba(45,65,100,.28),

        inset 0 1px 2px
        rgba(255,255,255,.85),

        inset 0 -1px 2px
        rgba(255,255,255,.12);

    animation:
        boothIn .8s cubic-bezier(.2,.8,.2,1);

}


@keyframes boothIn {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.96);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   GLASS HIGHLIGHT
===================================================== */

.booth::before {

    content: "";

    position: absolute;

    pointer-events: none;

    top: 0;
    left: 7%;

    width: 86%;
    height: 2px;

    border-radius: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.9),
            transparent
        );

}


/* =====================================================
   HEADER
===================================================== */

.header {

    text-align: center;

    margin-bottom: 25px;

}


.logo {

    font-size: 43px;

    font-weight: 800;

    letter-spacing: -1.5px;

    color: white;

    text-shadow:
        0 5px 20px
        rgba(50,60,90,.2);

}


.subtitle {

    margin-top: 7px;

    font-size: 15px;

    color:
        rgba(255,255,255,.78);

}


/* =====================================================
   CAMERA
===================================================== */

.camera {

    position: relative;

    overflow: hidden;

    width: 100%;

    border-radius: 28px;

    background:
        rgba(0,0,0,.3);

    border:
        1px solid
        rgba(255,255,255,.55);

    box-shadow:

        0 20px 50px
        rgba(30,50,80,.25),

        inset 0 1px 1px
        rgba(255,255,255,.5);

}


/* Camera reflection */

.camera::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 3;

    background:
        linear-gradient(
            125deg,
            rgba(255,255,255,.2),
            transparent 30%,
            transparent 70%,
            rgba(255,255,255,.08)
        );

}


video {

    width: 100%;

    display: block;

    transform:
        scaleX(-1);

    transition:
        filter .4s ease;

}


/* =====================================================
   FLASH
===================================================== */

.flash {

    position: absolute;

    inset: 0;

    z-index: 10;

    background: white;

    opacity: 0;

    pointer-events: none;

}


.flash.active {

    animation:
        cameraFlash .35s ease;

}


@keyframes cameraFlash {

    0% {
        opacity: 0;
    }

    30% {
        opacity: .9;
    }

    100% {
        opacity: 0;
    }

}


/* =====================================================
   COUNTDOWN
===================================================== */

.countdown {

    position: absolute;

    inset: 0;

    z-index: 8;

    display: none;

    justify-content: center;

    align-items: center;

    font-size: 120px;

    font-weight: 800;

    color: white;

    text-shadow:

        0 5px 25px
        rgba(0,0,0,.3),

        0 0 40px
        rgba(255,255,255,.5);

}


.countdown.show {

    display: flex;

    animation:
        countdownPop .9s ease;

}


@keyframes countdownPop {

    0% {

        opacity: 0;

        transform:
            scale(1.5);

    }

    45% {

        opacity: 1;

        transform:
            scale(1);

    }

    100% {

        opacity: 0;

        transform:
            scale(.85);

    }

}


/* =====================================================
   CAMERA STATUS
===================================================== */

.camera-status {

    position: absolute;

    left: 18px;

    top: 18px;

    z-index: 6;

    padding:
        8px 13px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.18);

    border:
        1px solid
        rgba(255,255,255,.4);

    backdrop-filter:
        blur(12px);

    font-size: 12px;

    color:
        rgba(255,255,255,.9);

}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 22px;

}


/* =====================================================
   GLASS SELECT
===================================================== */

select {

    appearance: none;

    border:
        1px solid
        rgba(255,255,255,.55);

    border-radius: 16px;

    padding:
        13px 40px 13px 17px;

    color: white;

    background:
        rgba(255,255,255,.18);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    outline: none;

    cursor: pointer;

    box-shadow:

        inset 0 1px 1px
        rgba(255,255,255,.6),

        0 8px 20px
        rgba(50,70,100,.12);

    transition:
        .3s ease;

}


select:hover {

    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.3);

    box-shadow:

        0 12px 28px
        rgba(50,70,100,.2);

}


select:focus {

    box-shadow:
        0 0 0 4px
        rgba(255,255,255,.2);

}


select option {

    background:
        #8e91b5;

    color: white;

}


/* =====================================================
   BUTTON
===================================================== */

button {

    position: relative;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.6);

    border-radius: 17px;

    padding:
        14px 24px;

    color: white;

    background:
        rgba(255,255,255,.2);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    cursor: pointer;

    font-weight: 700;

    box-shadow:

        inset 0 1px 1px
        rgba(255,255,255,.7),

        0 10px 25px
        rgba(50,70,100,.15);

    transition:

        transform .3s
        cubic-bezier(.2,.8,.2,1),

        box-shadow .3s ease,

        background .3s ease;

}


/* Shine */

button::before {

    content: "";

    position: absolute;

    top: -100%;

    left: -80%;

    width: 50%;

    height: 300%;

    transform:
        rotate(25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.5),
            transparent
        );

    transition:
        left .7s ease;

}


button:hover::before {

    left: 140%;

}


button:hover {

    transform:
        translateY(-4px)
        scale(1.025);

    background:
        rgba(255,255,255,.32);

    box-shadow:

        inset 0 1px 1px
        rgba(255,255,255,.9),

        0 15px 35px
        rgba(50,70,100,.22);

}


button:active {

    transform:
        translateY(1px)
        scale(.97);

}


/* =====================================================
   MAIN CAMERA BUTTON
===================================================== */

.capture {

    padding:
        16px 32px;

    font-size: 17px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.42),
            rgba(255,190,225,.3)
        );

    box-shadow:

        inset 0 1px 1px
        rgba(255,255,255,.9),

        0 10px 30px
        rgba(160,110,170,.2);

}


.capture:hover {

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.58),
            rgba(255,200,230,.42)
        );

}


/* =====================================================
   RETAKE
===================================================== */

.retake {

    display: none;

}


/* =====================================================
   DOWNLOAD
===================================================== */

.download {

    display: none;

    background:
        rgba(255,255,255,.25);

}


/* =====================================================
   PHOTO RESULT
===================================================== */

.result {

    display: flex;

    justify-content: center;

    margin-top: 28px;

}


canvas {

    display: none;

    width: min(500px,100%);

    border-radius: 20px;

    border:
        1px solid
        rgba(255,255,255,.7);

    box-shadow:

        0 25px 60px
        rgba(40,60,90,.3),

        0 0 0 8px
        rgba(255,255,255,.08);

    animation:
        resultIn .7s cubic-bezier(.2,.8,.2,1);

}


@keyframes resultIn {

    from {

        opacity: 0;

        transform:
            translateY(20px)
            scale(.94);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   BOTTOM INFO
===================================================== */

.bottom {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 8px;

    margin-top: 18px;

    color:
        rgba(255,255,255,.72);

    font-size: 13px;

}


.dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.8);

    box-shadow:
        0 0 10px
        rgba(255,255,255,.7);

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

    body {

        padding: 12px;

    }

    .booth {

        width: 100%;

        padding: 18px;

        border-radius: 28px;

    }

    .logo {

        font-size: 32px;

    }

    .subtitle {

        font-size: 13px;

    }

    .countdown {

        font-size: 80px;

    }

    .controls {

        flex-direction: column;

    }

    select,
    button {

        width: 100%;

    }

    .capture {

        padding: 16px;

    }

}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>


<!-- MAIN -->

<div class="booth">


    <!-- HEADER -->

    <div class="header">

        <h1 class="logo">
            📸 Liquid Booth
        </h1>

        <p class="subtitle">
            Capture the moment. Keep the memory. ✨
        </p>

    </div>


    <!-- CAMERA -->

    <div class="camera">

        <video
            id="video"
            autoplay
            playsinline>
        </video>


        <div
            class="camera-status"
            id="cameraStatus">

            ● Camera

        </div>


        <div
            class="countdown"
            id="countdown">

            3

        </div>


        <div
            class="flash"
            id="flash">

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">


        <!-- FRAME -->

        <select id="frame">

            <option value="joyful">
                🌈 Joyful
            </option>

            <option value="romantic">
                💕 Romantic
            </option>

            <option value="funny">
                🤪 Funny
            </option>

            <option value="cute">
                ✨ Cute
            </option>

            <option value="classic">
                🖤 Classic
            </option>

        </select>


        <!-- FILTER -->

        <select id="filter">

            <option value="none">
                🎨 Original
            </option>

            <option value="grayscale(1)">
                🖤 Black & White
            </option>

            <option value="sepia(1)">
                🤎 Vintage
            </option>

            <option value="contrast(1.15) saturate(1.4)">
                🌈 Vivid
            </option>

            <option value="brightness(1.15)">
                ☀️ Bright
            </option>

        </select>


        <!-- TAKE -->

        <button
            class="capture"
            id="captureBtn"
            onclick="startPhotoSession()">

            📸 Take Photos

        </button>


        <!-- RETAKE -->

        <button
            class="retake"
            id="retakeBtn"
            onclick="resetBooth()">

            🔄 Retake

        </button>


        <!-- DOWNLOAD -->

        <button
            class="download"
            id="downloadBtn"
            onclick="downloadPhoto()">

            ⬇️ Save Photo

        </button>

    </div>


    <!-- RESULT -->

    <div class="result">

        <canvas id="canvas"></canvas>

    </div>


    <!-- STATUS -->

    <div class="bottom">

        <span class="dot"></span>

        <span id="message">
            Allow camera access to begin
        </span>

    </div>


</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const countdown =
    document.getElementById("countdown");

const flash =
    document.getElementById("flash");

const filter =
    document.getElementById("filter");

const frame =
    document.getElementById("frame");

const message =
    document.getElementById("message");

const cameraStatus =
    document.getElementById("cameraStatus");

const captureBtn =
    document.getElementById("captureBtn");

const retakeBtn =
    document.getElementById("retakeBtn");

const downloadBtn =
    document.getElementById("downloadBtn");


let photos = [];

let takingPhotos = false;


/* =====================================================
   CAMERA
===================================================== */

navigator.mediaDevices
    .getUserMedia({
        video: true,
        audio: false
    })

    .then(stream => {

        video.srcObject = stream;

        cameraStatus.innerText =
            "● Camera Ready";

        message.innerText =
            "Choose your frame and filter ✨";

    })

    .catch(() => {

        cameraStatus.innerText =
            "● Camera Blocked";

        message.innerText =
            "Please allow camera access 📷";

    });


/* =====================================================
   FILTER PREVIEW
===================================================== */

filter.addEventListener(
    "change",
    () => {

        video.style.filter =
            filter.value;

    }
);


/* =====================================================
   COUNTDOWN
===================================================== */

function runCountdown() {

    return new Promise(resolve => {

        let number = 3;


        function showNumber() {

            countdown.innerText =
                number;

            countdown.classList.remove(
                "show"
            );


            /* Restart animation */

            void countdown.offsetWidth;


            countdown.classList.add(
                "show"
            );

        }


        showNumber();


        const timer =
            setInterval(() => {

                number--;


                if (number === 0) {

                    clearInterval(timer);

                    countdown.classList.remove(
                        "show"
                    );

                    resolve();

                }

                else {

                    showNumber();

                }

            }, 1000);

    });

}


/* =====================================================
   FLASH
===================================================== */

function cameraFlash() {

    flash.classList.remove(
        "active"
    );

    void flash.offsetWidth;

    flash.classList.add(
        "active"
    );

}


/* =====================================================
   TAKE ONE PHOTO
===================================================== */

function takePhoto() {

    const tempCanvas =
        document.createElement(
            "canvas"
        );


    tempCanvas.width =
        video.videoWidth;

    tempCanvas.height =
        video.videoHeight;


    const tempCtx =
        tempCanvas.getContext(
            "2d"
        );


    /* Mirror */

    tempCtx.translate(
        tempCanvas.width,
        0
    );

    tempCtx.scale(
        -1,
        1
    );


    /* Filter */

    tempCtx.filter =
        filter.value;


    tempCtx.drawImage(
        video,
        0,
        0,
        tempCanvas.width,
        tempCanvas.height
    );


    return tempCanvas;

}


/* =====================================================
   PHOTO SESSION
===================================================== */

async function startPhotoSession() {


    if (takingPhotos) return;


    takingPhotos = true;

    photos = [];


    captureBtn.disabled =
        true;


    captureBtn.style.opacity =
        ".5";


    retakeBtn.style.display =
        "none";

    downloadBtn.style.display =
        "none";

    canvas.style.display =
        "none";


    for (
        let i = 0;
        i < 4;
        i++
    ) {


        message.innerText =
            `Photo ${i + 1} of 4 — Get ready!`;


        await runCountdown();


        cameraFlash();


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    120
                )
        );


        photos.push(
            takePhoto()
        );


        message.innerText =
            `Photo ${i + 1} captured ✨`;


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    700
                )
        );

    }


    createPhotoStrip();


    takingPhotos = false;

}


/* =====================================================
   CREATE PHOTO STRIP
===================================================== */

function createPhotoStrip() {


    const width =
        600;


    const photoHeight =
        420;


    const padding =
        35;


    const gap =
        18;


    const footer =
        105;


    canvas.width =
        width;


    canvas.height =
        padding +
        (photoHeight * 4) +
        (gap * 3) +
        footer;


    const selected =
        frame.value;


    /* =================================================
       BACKGROUND
    ================================================= */

    const bg =
        ctx.createLinearGradient(
            0,
            0,
            width,
            canvas.height
        );


    if (
        selected === "joyful"
    ) {

        bg.addColorStop(
            0,
            "#fff1a8"
        );

        bg.addColorStop(
            1,
            "#ffd6ec"
        );

    }

    else if (
        selected === "romantic"
    ) {

        bg.addColorStop(
            0,
            "#ffd9e7"
        );

        bg.addColorStop(
            1,
            "#f4c8df"
        );

    }

    else if (
        selected === "funny"
    ) {

        bg.addColorStop(
            0,
            "#bff5ff"
        );

        bg.addColorStop(
            1,
            "#d9f5b5"
        );

    }

    else if (
        selected === "cute"
    ) {

        bg.addColorStop(
            0,
            "#e8d7ff"
        );

        bg.addColorStop(
            1,
            "#ffd8ef"
        );

    }

    else {

        bg.addColorStop(
            0,
            "#eeeeee"
        );

        bg.addColorStop(
            1,
            "#cccccc"
        );

    }


    ctx.fillStyle =
        bg;


    ctx.fillRect(
        0,
        0,
        width,
        canvas.height
    );


    /* =================================================
       PHOTOS
    ================================================= */

    photos.forEach(
        (photo, index) => {


        const y =
            padding +
            index *
            (photoHeight + gap);


        /* White glass frame */

        ctx.fillStyle =
            "rgba(255,255,255,.9)";


        ctx.beginPath();

        ctx.roundRect(
            22,
            y - 5,
            width - 44,
            photoHeight + 10,
            16
        );

        ctx.fill();


        /* Photo */

        ctx.save();


        ctx.beginPath();

        ctx.roundRect(
            28,
            y,
            width - 56,
            photoHeight,
            12
        );

        ctx.clip();


        ctx.drawImage(
            photo,
            28,
            y,
            width - 56,
            photoHeight
        );


        ctx.restore();


    });


    /* =================================================
       DECORATIONS
    ================================================= */

    drawDecorations(
        selected
    );


    /* =================================================
       FOOTER
    ================================================= */

    ctx.textAlign =
        "center";


    ctx.font =
        "bold 27px Arial";


    if (
        selected === "joyful"
    ) {

        ctx.fillStyle =
            "#e94d78";

        ctx.fillText(
            "🌈 GOOD VIBES 🌈",
            width / 2,
            canvas.height - 55
        );

    }

    else if (
        selected === "romantic"
    ) {

        ctx.fillStyle =
            "#c94c7b";

        ctx.fillText(
            "💕 SWEET MEMORIES 💕",
            width / 2,
            canvas.height - 55
        );

    }

    else if (
        selected === "funny"
    ) {

        ctx.fillStyle =
            "#e87518";

        ctx.fillText(
            "😂 LOL • HAHA • OMG 😂",
            width / 2,
            canvas.height - 55
        );

    }

    else if (
        selected === "cute"
    ) {

        ctx.fillStyle =
            "#8e63b7";

        ctx.fillText(
            "✨ CUTIE MOMENTS ✨",
            width / 2,
            canvas.height - 55
        );

    }

    else {

        ctx.fillStyle =
            "#333";

        ctx.fillText(
            "LIQUID BOOTH",
            width / 2,
            canvas.height - 55
        );

    }


    /* =================================================
       SHOW RESULT
    ================================================= */

    canvas.style.display =
        "block";


    retakeBtn.style.display =
        "inline-block";


    downloadBtn.style.display =
        "inline-block";


    captureBtn.disabled =
        false;


    captureBtn.style.opacity =
        "1";


    message.innerText =
        "Your photo strip is ready! 🎉";


    canvas.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}


/* =====================================================

===================================================== */

function drawDecorations(type) {


    ctx.textAlign =
        "center";

    ctx.font =
        "30px Arial";


    if (
        type === "joyful"
    ) {

        ctx.fillText(
            "⭐ 🌈 ☀️ 🌈 ⭐",
            300,
            25
        );


        ctx.fillText(
            "🎈 ✨ 🎈 ✨ 🎈",
            300,
            canvas.height - 82
        );

    }


    else if (
        type === "romantic"
    ) {

        ctx.fillText(
            "💕 💗 💕 💗 💕",
            300,
            25
        );


        ctx.fillText(
            "💖 💕 💖 💕 💖",
            300,
            canvas.height - 82
        );

    }


    else if (
        type === "funny"
    ) {

        ctx.fillText(
            "😂 🤪 😂 🤪 😂",
            300,
            25
        );


        ctx.font =
            "bold 20px Arial";


        ctx.fillText(
            "HAHA • LOL • OMG",
            300,
            canvas.height - 82
        );

    }


    else if (
        type === "cute"
    ) {

        ctx.fillText(

        );


        ctx.fillText(
            "🌷 ⭐ 🌷 ⭐ 🌷",
            300,
            canvas.height - 82
        );

    }


    else {

        ctx.fillText(
            "• • • • •",
            300,
            25
        );

    }

}


/* =====================================================
   RETAKE
===================================================== */

function resetBooth() {


    photos = [];


    canvas.style.display =
        "none";


    retakeBtn.style.display =
        "none";


    downloadBtn.style.display =
        "none";


    captureBtn.style.display =
        "inline-block";


    message.innerText =
        "Ready for another photo? 📸";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   DOWNLOAD
===================================================== */

function downloadPhoto() {


    if (!canvas.width) return;


    const link =
        document.createElement(
            "a"
        );


    link.download =
        "liquid-glass-photobooth.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();

}
