<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liquid Booth</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.35), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(255,180,230,.35), transparent 30%),
        linear-gradient(120deg,#74dff5,#938bea,#dd9bd8,#72def2);

    background-size: 200% 200%;
    animation: backgroundMove 15s ease infinite;
}

@keyframes backgroundMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

.app {
    width: min(1150px, 96%);
    margin: auto;
    padding: 25px 0 50px;
}

.glass {
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.55);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 20px 60px rgba(30,50,100,.2),
        inset 0 1px 2px rgba(255,255,255,.8);
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.logo {
    width: 55px;
    height: 55px;

    display: grid;
    place-items: center;

    border-radius: 18px;
    font-size: 27px;
}

.title h1 {
    font-size: clamp(25px, 5vw, 36px);
    letter-spacing: 1px;
}

.title p {
    margin-top: 4px;
    opacity: .75;
    font-size: 13px;
}

/* MAIN */

.main {
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    gap: 18px;
}

/* CAMERA */

.cameraCard {
    padding: 12px;
    border-radius: 30px;
}

.camera {
    position: relative;

    width: 100%;
    aspect-ratio: 4 / 3;

    overflow: hidden;
    border-radius: 22px;

    background: #111;
}

#video {
    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    background: #111;

    transition: filter .35s ease;
}

/* STATUS */

.status {
    position: absolute;

    top: 12px;
    left: 12px;

    z-index: 20;

    padding: 8px 12px;

    border-radius: 20px;

    background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.4);

    backdrop-filter: blur(12px);

    font-size: 12px;
}

.dot {
    color: #76ffae;
}

/* COUNTDOWN */

#countdown {
    position: absolute;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 50;

    font-size: 130px;
    font-weight: bold;

    text-shadow:
        0 0 25px white,
        0 8px 30px rgba(0,0,0,.4);
}

#countdown.show {
    display: flex;
    animation: countdownAnimation .8s ease;
}

@keyframes countdownAnimation {
    0% {
        transform: scale(1.5);
        opacity: 0;
    }

    25% {
        transform: scale(1);
        opacity: 1;
    }

    100% {
        transform: scale(.7);
        opacity: 0;
    }
}

/* FLASH */

#flash {
    position: absolute;
    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 100;
}

#flash.active {
    animation: cameraFlash .3s ease;
}

@keyframes cameraFlash {
    0% {
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

/* CONTROLS */

.controls {
    padding: 20px;
    border-radius: 30px;
}

.section {
    margin-bottom: 20px;
}

.sectionTitle {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* FILTER */

select {
    width: 100%;
    height: 48px;

    padding: 0 14px;

    color: white;

    background: rgba(255,255,255,.15);

    border: 1px solid rgba(255,255,255,.55);

    border-radius: 15px;

    outline: none;

    cursor: pointer;

    transition: .2s ease;
}

select:hover {
    background: rgba(255,255,255,.25);
}

option {
    background: #69699f;
    color: white;
}

/* FRAME */

.frameGrid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
}

.frameBtn {
    min-height: 55px;

    border: 1px solid rgba(255,255,255,.5);

    background: rgba(255,255,255,.12);

    color: white;

    border-radius: 17px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.frameBtn:hover {
    background: rgba(255,255,255,.25);

    transform: translateY(-2px);
}

.frameBtn:active {
    transform: scale(.96);
}

.frameBtn.selected {
    background: rgba(255,255,255,.32);

    border-color: white;

    box-shadow:
        0 0 25px rgba(255,255,255,.25);
}

.joyful {
    background:
        linear-gradient(
            135deg,
            rgba(255,220,50,.4),
            rgba(255,100,190,.4)
        );
}

.romantic {
    background:
        linear-gradient(
            135deg,
            rgba(255,100,170,.4),
            rgba(190,100,230,.4)
        );
}

.funny {
    background:
        linear-gradient(
            135deg,
            rgba(70,220,255,.4),
            rgba(100,255,160,.4)
        );
}

/* CAPTURE */

.captureBtn {
    width: 100%;
    min-height: 62px;

    border: 1px solid rgba(255,255,255,.7);

    border-radius: 20px;

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.35),
            rgba(255,120,210,.3),
            rgba(70,210,255,.3)
        );

    box-shadow:
        0 12px 35px rgba(50,70,150,.3),
        inset 0 1px 2px white;

    transition: .2s ease;
}

.captureBtn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 15px 40px rgba(50,70,150,.4),
        0 0 25px rgba(255,255,255,.2);
}

.captureBtn:active {
    transform: scale(.97);
}

.captureBtn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* RESULT */

.result {
    display: none;

    margin-top: 20px;

    padding: 20px;

    border-radius: 30px;
}

.result.show {
    display: block;

    animation: resultIn .4s ease;
}

@keyframes resultIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.result h2 {
    margin-bottom: 15px;
}

#resultCanvas {
    display: block;

    width: 100%;
    max-width: 600px;
    height: auto;

    margin: auto;

    border-radius: 18px;
}

.resultButtons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    max-width: 600px;

    margin: 15px auto 0;
}

.actionBtn {
    min-height: 52px;

    border: 1px solid rgba(255,255,255,.5);

    background: rgba(255,255,255,.15);

    color: white;

    border-radius: 17px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s ease;
}

.actionBtn:hover {
    background: rgba(255,255,255,.28);
    transform: translateY(-2px);
}

.actionBtn:active {
    transform: scale(.96);
}

/* MOBILE */

@media (max-width: 800px) {

    .app {
        width: 95%;
        padding-top: 12px;
    }

    .main {
        grid-template-columns: 1fr;
    }

    .cameraCard {
        padding: 8px;
    }

    .controls {
        padding: 15px;
    }
}

@media (max-width: 430px) {

    .frameGrid {
        grid-template-columns: repeat(2,1fr);
    }

    .resultButtons {
        grid-template-columns: 1fr;
    }

    #countdown {
        font-size: 90px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="glass logo">
            📸
        </div>

        <div class="title">
            <h1>LIQUID BOOTH</h1>
            <p>Your pocket photo booth ✨</p>
        </div>

    </div>


    <!-- MAIN -->

    <div class="main">

        <!-- CAMERA -->

        <div class="glass cameraCard">

            <div class="camera">

                <video
                    id="video"
                    autoplay
                    muted
                    playsinline>
                </video>

                <div class="status">
                    <span class="dot">●</span>
                    <span id="status">
                        Memulai kamera...
                    </span>
                </div>

                <div id="countdown"></div>

                <div id="flash"></div>

            </div>

        </div>


        <!-- CONTROLS -->

        <div class="glass controls">

            <!-- FILTER -->

            <div class="section">

                <div class="sectionTitle">
                    🎨 Filter
                </div>

                <select id="filterSelect">

                    <option value="none">
                        Original
                    </option>

                    <option value="warm">
                        ☀️ Warm
                    </option>

                    <option value="vintage">
                        📼 Vintage
                    </option>

                    <option value="bw">
                        🖤 Black & White
                    </option>

                    <option value="cool">
                        ❄️ Cool
                    </option>

                    <option value="vivid">
                        🌈 Vivid
                    </option>

                </select>

            </div>


            <!-- FRAME -->

            <div class="section">

                <div class="sectionTitle">
                    🖼️ Frame
                </div>

                <div class="frameGrid">

                    <button
                        class="frameBtn joyful selected"
                        data-frame="joyful">

                        🌈 Joyful

                    </button>

                    <button
                        class="frameBtn romantic"
                        data-frame="romantic">

                        💕 Romantic

                    </button>

                    <button
                        class="frameBtn funny"
                        data-frame="funny">

                        😂 Funny

                    </button>

                </div>

            </div>


            <!-- CAPTURE -->

            <button
                id="captureBtn"
                class="captureBtn">

                📸 MULAI FOTO — 4X

            </button>

        </div>

    </div>


    <!-- RESULT -->

    <div
        id="result"
        class="glass result">

        <h2>
            📸 Hasil Photo Booth
        </h2>

        <canvas id="resultCanvas"></canvas>

        <div class="resultButtons">

            <button
                id="retakeBtn"
                class="actionBtn">

                🔄 Foto Lagi

            </button>

            <button
                id="downloadBtn"
                class="actionBtn">

                ⬇️ Download Foto

            </button>

        </div>

    </div>

</div>


<script>

/* ================= ELEMENTS ================= */

const video =
    document.getElementById("video");

const statusText =
    document.getElementById("status");

const countdown =
    document.getElementById("countdown");

const flash =
    document.getElementById("flash");

const captureBtn =
    document.getElementById("captureBtn");

const filterSelect =
    document.getElementById("filterSelect");

const resultBox =
    document.getElementById("result");

const resultCanvas =
    document.getElementById("resultCanvas");


/* ================= VARIABLES ================= */

let stream = null;

let selectedFilter = "none";

let selectedFrame = "joyful";

let photos = [];

let capturing = false;


/* ================= FILTER ================= */

function getFilter(filter) {

    switch (filter) {

        case "warm":
            return "sepia(.25) saturate(1.3) contrast(1.05)";

        case "vintage":
            return "sepia(.45) saturate(.75) contrast(1.05)";

        case "bw":
            return "grayscale(1) contrast(1.1)";

        case "cool":
            return "saturate(.9) hue-rotate(20deg)";

        case "vivid":
            return "saturate(1.55) contrast(1.12)";

        default:
            return "none";
    }
}


/* ================= CAMERA ================= */

async function startCamera() {

    statusText.textContent =
        "Meminta izin kamera...";

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    frameRate: {
                        ideal: 30,
                        max: 30
                    }
                },

                audio: false

            });

        video.srcObject =
            stream;

        video.muted =
            true;

        video.playsInline =
            true;

        await video.play();

        statusText.textContent =
            "Kamera aktif";

    }

    catch (error) {

        console.error(error);

        statusText.textContent =
            "Kamera gagal dibuka";

        alert(
            "Kamera tidak bisa dibuka.\n\n" +
            "Pastikan kamera tidak sedang digunakan " +
            "aplikasi lain dan tekan Allow saat browser meminta izin."
        );

    }

}


/* ================= FILTER PREVIEW ================= */

filterSelect.addEventListener(
    "change",
    () => {

        selectedFilter =
            filterSelect.value;

        video.style.filter =
            getFilter(
                selectedFilter
            );

    }
);


/* ================= FRAME ================= */

document
.querySelectorAll(".frameBtn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".frameBtn")
            .forEach(btn => {

                btn.classList.remove(
                    "selected"
                );

            });

            button.classList.add(
                "selected"
            );

            selectedFrame =
                button.dataset.frame;

        }
    );

});


/* ================= WAIT ================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* ================= COUNTDOWN ================= */

async function runCountdown() {

    for (
        let i = 3;
        i >= 1;
        i--
    ) {

        countdown.textContent =
            i;

        countdown.classList.remove(
            "show"
        );

        void countdown.offsetWidth;

        countdown.classList.add(
            "show"
        );

        await wait(850);

    }

}


/* ================= FLASH ================= */

async function flashScreen() {

    flash.classList.remove(
        "active"
    );

    void flash.offsetWidth;

    flash.classList.add(
        "active"
    );

    await wait(300);

}


/* ================= TAKE PHOTO ================= */

function takePhoto() {

    if (
        video.readyState < 2
    ) {

        return null;

    }

    const width =
        video.videoWidth;

    const height =
        video.videoHeight;

    if (
        !width ||
        !height
    ) {

        return null;

    }


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
        Mirror hasil foto
        supaya sama seperti
        kamera selfie.
    */

    ctx.save();

    ctx.translate(
        width,
        0
    );

    ctx.scale(
        -1,
        1
    );


    ctx.filter =
        getFilter(
            selectedFilter
        );


    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );

    ctx.restore();


    return canvas;

}


/* ================= CAPTURE ================= */

captureBtn.addEventListener(
    "click",
    async () => {

        if (capturing) {
            return;
        }

        if (
            !stream ||
            video.readyState < 2
        ) {

            alert(
                "Kamera belum siap."
            );

            return;

        }


        capturing = true;

        photos = [];


        captureBtn.disabled =
            true;

        captureBtn.textContent =
            "📸 MENGAMBIL FOTO...";


        try {

            for (
                let i = 0;
                i < 4;
                i++
            ) {

                await runCountdown();

                await flashScreen();

                const photo =
                    takePhoto();

                if (photo) {

                    photos.push(
                        photo
                    );

                }

                await wait(700);

            }


            if (
                photos.length > 0
            ) {

                createPhotoStrip();

                resultBox.scrollIntoView({
                    behavior: "smooth"
                });

            }

        }

        catch (error) {

            console.error(error);

            alert(
                "Terjadi kesalahan saat mengambil foto."
            );

        }


        capturing = false;

        captureBtn.disabled =
            false;

        captureBtn.textContent =
            "📸 MULAI FOTO — 4X";

    }
);


/* ================= PHOTO STRIP ================= */

function createPhotoStrip() {

    const W = 700;

    const photoW = 620;

    const photoH = 465;

    const margin = 40;

    const top = 70;

    const gap = 15;

    const footer = 100;


    resultCanvas.width =
        W;

    resultCanvas.height =
        top +
        photos.length * photoH +
        (photos.length - 1) * gap +
        footer;


    const ctx =
        resultCanvas.getContext(
            "2d"
        );


    let background;


    if (
        selectedFrame === "romantic"
    ) {

        background =
            "#ffd6e6";

    }

    else if (
        selectedFrame === "funny"
    ) {

        background =
            "#c9f4df";

    }

    else {

        background =
            "#ffe9a8";

    }


    ctx.fillStyle =
        background;

    ctx.fillRect(
        0,
        0,
        W,
        resultCanvas.height
    );


    /* TITLE */

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 30px Arial";

    ctx.fillStyle =
        "#555";


    let title;


    if (
        selectedFrame === "romantic"
    ) {

        title =
            "SWEET MEMORIES 💕";

    }

    else if (
        selectedFrame === "funny"
    ) {

        title =
            "FUN TIMES 😂";

    }

    else {

        title =
            "GOOD VIBES 🌈";

    }


    ctx.fillText(
        title,
        W / 2,
        45
    );


    /* PHOTOS */

    photos.forEach(
        (photo,index) => {

            const y =
                top +
                index *
                (photoH + gap);


            ctx.fillStyle =
                "white";


            roundedRect(
                ctx,
                margin - 6,
                y - 6,
                photoW + 12,
                photoH + 12,
                14
            );

            ctx.fill();


            ctx.save();


            roundedRect(
                ctx,
                margin,
                y,
                photoW,
                photoH,
                10
            );

            ctx.clip();


            ctx.drawImage(
                photo,
                margin,
                y,
                photoW,
                photoH
            );


            ctx.restore();

        }
    );


    /* FOOTER */

    ctx.font =
        "bold 24px Arial";

    ctx.fillStyle =
        "#555";


    ctx.fillText(
        "✨ LIQUID BOOTH ✨",
        W / 2,
        resultCanvas.height - 35
    );


    resultBox.classList.add(
        "show"
    );

}


/* ================= ROUNDED RECT ================= */

function roundedRect(
    ctx,
    x,
    y,
    w,
    h,
    r
) {

    ctx.beginPath();

    ctx.moveTo(
        x + r,
        y
    );

    ctx.lineTo(
        x + w - r,
        y
    );

    ctx.quadraticCurveTo(
        x + w,
        y,
        x + w,
        y + r
    );

    ctx.lineTo(
        x + w,
        y + h - r
    );

    ctx.quadraticCurveTo(
        x + w,
        y + h,
        x + w - r,
        y + h
    );

    ctx.lineTo(
        x + r,
        y + h
    );

    ctx.quadraticCurveTo(
        x,
        y + h,
        x,
        y + h - r
    );

    ctx.lineTo(
        x,
        y + r
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + r,
        y
    );

    ctx.closePath();

}


/* ================= DOWNLOAD ================= */

document
.getElementById("downloadBtn")
.addEventListener(
    "click",
    () => {

        if (
            !resultCanvas.width ||
            !resultCanvas.height
        ) {

            alert(
                "Belum ada foto."
            );

            return;

        }


        resultCanvas.toBlob(
            blob => {

                if (!blob) {

                    alert(
                        "Download gagal."
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;

                link.download =
                    "liquid-booth-" +
                    Date.now() +
                    ".png";


                document.body.appendChild(
                    link
                );

                link.click();

                document.body.removeChild(
                    link
                );


                setTimeout(
                    () => {

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );

            },

            "image/png"

        );

    }
);


/* ================= RETAKE ================= */

document
.getElementById("retakeBtn")
.addEventListener(
    "click",
    () => {

        photos = [];


        resultBox.classList.remove(
            "show"
        );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
);


/* ================= START CAMERA ================= */

startCamera();


/* ================= CLEANUP ================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (stream) {

            stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        }

    }
);

</script>

</body>
</html>
